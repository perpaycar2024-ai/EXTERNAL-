<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EXTERNAL</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXTERNAL">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a14; --bg2:#15101f; --bg3:#1c1628;
    --card:#1c1628; --card2:#241c34;
    --border:#2c2440; --border2:#3c3155;
    --accent:#d4a14f; --accent2:#e8c272;
    --text:#f0ece0; --text2:#c4bcd4; --text3:#867c9c;
    --urgent:#e0584a; --ok:#5fae7c;
    --radius:16px; --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    overflow-x:hidden; min-height:100vh;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 0%, rgba(212,161,79,0.08) 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 90% 100%, rgba(124,90,200,0.07) 0%, transparent 60%);
  }
  #launcher{position:relative;z-index:1; max-width:680px; margin:0 auto; padding:0 0 60px;}

  /* HEADER */
  .header{padding:32px 20px 8px;}
  .header-eyebrow{font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:8px;}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(212,161,79,0.6); animation:pulse 2.4s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(212,161,79,0.5);}
    70%{box-shadow:0 0 0 8px rgba(212,161,79,0);}
    100%{box-shadow:0 0 0 0 rgba(212,161,79,0);}
  }
  .header-title{font-family:'DM Serif Display',serif; font-size:2.4rem; letter-spacing:-0.5px; margin-top:6px;}
  .header-title em{color:var(--accent); font-style:normal;}
  .header-sub{font-size:0.88rem; color:var(--text3); margin-top:6px; line-height:1.5; max-width:48ch;}

  /* BUSCADOR */
  .search-wrap{padding:18px 20px 0;}
  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:13px 16px; transition:border-color .2s;
  }
  .search-box:focus-within{border-color:var(--accent);}
  .search-box input{
    flex:1; background:none; border:none; outline:none; color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:0.95rem;
  }
  .search-box input::placeholder{color:var(--text3);}
  .search-icon{font-size:1rem; opacity:0.7;}
  #search-results{padding:10px 20px 0; display:flex; flex-direction:column; gap:8px;}
  .search-empty{font-size:0.84rem; color:var(--text3); padding:14px 4px;}
  .result-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; font-size:0.88rem; color:var(--text2); line-height:1.5;
  }
  .result-date{font-size:0.72rem; color:var(--accent2); font-weight:600; margin-bottom:4px; display:block;}

  /* SECCIONES */
  .section-title{
    font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text3); padding:28px 20px 12px;
  }

  /* NOTAS RÁPIDAS */
  .notes-box{margin:0 20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .notes-input-row{display:flex; gap:8px; align-items:flex-end;}
  .notes-textarea{
    flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.92rem;
    resize:none; min-height:46px; max-height:140px; outline:none; transition:border-color .2s; line-height:1.5;
  }
  .notes-textarea:focus{border-color:var(--accent);}
  .notes-textarea::placeholder{color:var(--text3);}
  .btn-mic{
    flex-shrink:0; width:46px; height:46px; border-radius:50%; border:1px solid var(--border2);
    background:var(--bg3); color:var(--text2); font-size:1.15rem; cursor:pointer; transition:all .2s;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-mic:hover{border-color:var(--accent); color:var(--accent);}
  .btn-mic.recording{background:var(--urgent); border-color:var(--urgent); color:#fff; animation:micpulse 1.2s infinite;}
  @keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(224,88,74,0.5);}70%{box-shadow:0 0 0 10px rgba(224,88,74,0);}100%{box-shadow:0 0 0 0 rgba(224,88,74,0);}}
  .btn-save-note{
    flex-shrink:0; height:46px; padding:0 18px; border-radius:var(--radius-sm); border:none;
    background:var(--accent); color:#1a1206; font-weight:700; font-size:0.88rem; cursor:pointer; transition:background .2s;
  }
  .btn-save-note:hover{background:var(--accent2);}
  .mic-status{font-size:0.78rem; color:var(--accent2); margin-top:8px; min-height:1em;}
  .notes-hint{font-size:0.76rem; color:var(--text3); margin-top:8px;}

  .notes-list{display:flex; flex-direction:column; gap:8px; margin:14px 20px 0;}
  .note-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
  }
  .note-icon{font-size:0.95rem; margin-top:1px; flex-shrink:0;}
  .note-body{flex:1; min-width:0;}
  .note-text{font-size:0.9rem; color:var(--text); line-height:1.5; word-break:break-word;}
  .note-meta{font-size:0.72rem; color:var(--text3); margin-top:4px;}
  .note-del{background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.95rem; flex-shrink:0; padding:2px;}
  .note-del:hover{color:var(--urgent);}
  .notes-empty{font-size:0.84rem; color:var(--text3); padding:16px 4px; text-align:center;}

  /* GRID MÓDULOS */
  .modules-grid{padding:0 20px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .module-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 16px; cursor:pointer; position:relative; overflow:hidden; transition:border-color .2s, transform .15s;
    min-height:108px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .module-card:active{transform:scale(0.97);}
  .module-card:not(.disabled):hover{border-color:var(--accent);}
  .module-card.disabled{opacity:0.45; cursor:default;}
  .module-emoji{font-size:1.7rem;}
  .module-name{font-weight:600; font-size:0.95rem; margin-top:10px;}
  .module-status{font-size:0.72rem; color:var(--text3); margin-top:2px;}

  /* MODAL MODULO (pantalla completa) */
  #module-screen{
    position:fixed; inset:0; z-index:500; background:var(--bg);
    display:none; flex-direction:column;
  }
  #module-screen.open{display:flex;}
  .module-bar{
    flex-shrink:0; background:var(--bg2); border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px;
  }
  .module-back{
    background:var(--card2); border:1px solid var(--border2); color:var(--text);
    border-radius:var(--radius-sm); padding:9px 14px; font-size:0.86rem; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-family:'DM Sans',sans-serif;
  }
  .module-back:hover{border-color:var(--accent); color:var(--accent);}
  .module-bar-title{font-size:0.82rem; color:var(--text3); font-weight:600;}
  #module-frame{flex:1; width:100%; border:none; background:#fff;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:3px;}
</style>
</head>
<body>

<div id="launcher">
  <div class="header">
    <div class="header-eyebrow"><span class="pulse"></span>memoria externa</div>
    <div class="header-title">EXTE<em>RNAL</em></div>
    <div class="header-sub">Lo que no tienes por qué recordar tú solo. Apunta, pregunta, y abre cada módulo cuando lo necesites.</div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="¿Cuándo fue…? Busca en tus notas" oninput="buscar(this.value)">
    </div>
  </div>
  <div id="search-results"></div>

  <div class="section-title">Notas rápidas</div>
  <div class="notes-box">
    <div class="notes-input-row">
      <textarea id="note-input" class="notes-textarea" placeholder="Escribe o dicta algo que no quieras olvidar…" rows="1" oninput="autoGrow(this)"></textarea>
      <button class="btn-mic" id="btn-mic" onclick="toggleDictado()" title="Dictar nota">🎙️</button>
      <button class="btn-save-note" onclick="guardarNota()">Guardar</button>
    </div>
    <div class="mic-status" id="mic-status"></div>
  </div>
  <div class="notes-list" id="notes-list"></div>

  <div class="section-title">Tus módulos</div>
  <div class="modules-grid" id="modules-grid"></div>
</div>

<div id="module-screen">
  <div class="module-bar">
    <button class="module-back" onclick="cerrarModulo()">← EXTERNAL</button>
    <span class="module-bar-title" id="module-bar-title"></span>
  </div>
  <iframe id="module-frame" src=""></iframe>
</div>

<script>
// ── DB (memoria compartida EXTERNAL) ──────────────────────
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('external_db',1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('tareas_folders')) d.createObjectStore('tareas_folders',{keyPath:'id'});
      if(!d.objectStoreNames.contains('tareas_tasks')){ const ts=d.createObjectStore('tareas_tasks',{keyPath:'id'}); ts.createIndex('folderId','folderId'); }
      if(!d.objectStoreNames.contains('coches')) d.createObjectStore('coches',{keyPath:'id'});
      if(!d.objectStoreNames.contains('notes')) d.createObjectStore('notes',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=rej;
  });
}
const dbGetAll=s=>new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej;});
const dbPut=(s,o)=>new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>res();r.onerror=rej;});
const dbDel=(s,id)=>new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>res();r.onerror=rej;});

// ── UTILS ──────────────────────────────────────────────
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const normaliza=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function fechaBonita(ts){
  return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }

// ── MÓDULOS ────────────────────────────────────────────
const MODULOS=[
  {id:'tareas', nombre:'Tareas', emoji:'📋', src:'./Modules/tareas.html', activo:true},
  {id:'coches', nombre:'Vehículos', emoji:'🚗', src:'./Modules/coches.html', activo:true},
  {id:'diario', nombre:'Diario', emoji:'📔', src:null, activo:false},
  {id:'riegos', nombre:'Riegos', emoji:'🌿', src:null, activo:false},
  {id:'residencia', nombre:'Residencia', emoji:'🏥', src:null, activo:false},
];
function renderModulos(){
  document.getElementById('modules-grid').innerHTML=MODULOS.map(m=>`
    <div class="module-card${m.activo?'':' disabled'}" ${m.activo?`onclick="abrirModulo('${m.id}')"`:''}>
      <span class="module-emoji">${m.emoji}</span>
      <div>
        <div class="module-name">${m.nombre}</div>
        <div class="module-status">${m.activo?'Abrir':'Próximamente'}</div>
      </div>
    </div>`).join('');
}
function abrirModulo(id){
  const m=MODULOS.find(x=>x.id===id); if(!m||!m.activo) return;
  document.getElementById('module-bar-title').textContent=m.nombre;
  document.getElementById('module-frame').src=m.src;
  document.getElementById('module-screen').classList.add('open');
}
function cerrarModulo(){
  document.getElementById('module-screen').classList.remove('open');
  document.getElementById('module-frame').src='';
}

// ── NOTAS ──────────────────────────────────────────────
async function cargarNotas(){
  const notas=await dbGetAll('notes');
  notas.sort((a,b)=>b.createdAt-a.createdAt);
  const list=document.getElementById('notes-list');
  if(!notas.length){ list.innerHTML='<div class="notes-empty">Aún no hay notas guardadas.</div>'; return; }
  list.innerHTML=notas.slice(0,12).map(n=>`
    <div class="note-card">
      <span class="note-icon">${n.source==='voz'?'🎙️':'📝'}</span>
      <div class="note-body">
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-meta">${fechaBonita(n.createdAt)}</div>
      </div>
      <button class="note-del" onclick="borrarNota('${n.id}')">🗑</button>
    </div>`).join('');
}
async function guardarNota(){
  const input=document.getElementById('note-input');
  const text=input.value.trim();
  if(!text) return;
  await dbPut('notes',{id:uid(),text,source:'texto',createdAt:Date.now()});
  input.value=''; autoGrow(input);
  cargarNotas();
}
async function borrarNota(id){
  await dbDel('notes',id);
  cargarNotas();
}

// ── DICTADO (Web Speech API) ────────────────────────────
let recognition=null, escuchando=false;
function toggleDictado(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('mic-status').textContent='Tu navegador no soporta dictado por voz. Escribe la nota a mano.';
    return;
  }
  if(escuchando){ recognition.stop(); return; }
  recognition=new SR();
  recognition.lang='es-ES';
  recognition.interimResults=true;
  recognition.continuous=true;
  const btn=document.getElementById('btn-mic'), status=document.getElementById('mic-status'), input=document.getElementById('note-input');
  const base=input.value.trim();
  recognition.onstart=()=>{ escuchando=true; btn.classList.add('recording'); status.textContent='Escuchando… toca el micro otra vez para parar.'; };
  recognition.onresult=e=>{
    let texto='';
    for(let i=0;i<e.results.length;i++) texto+=e.results[i][0].transcript;
    input.value=(base?base+' ':'')+texto;
    autoGrow(input);
  };
  recognition.onerror=()=>{ status.textContent='No se ha podido escuchar bien. Inténtalo de nuevo.'; };
  recognition.onend=()=>{ escuchando=false; btn.classList.remove('recording'); status.textContent='Nota dictada. Revisa el texto y pulsa Guardar.'; };
  recognition.start();
}

// ── LUPA (búsqueda en notas) ─────────────────────────────
async function buscar(q){
  const cont=document.getElementById('search-results');
  const term=q.trim();
  if(!term){ cont.innerHTML=''; return; }
  const notas=await dbGetAll('notes');
  const t=normaliza(term);
  const encontradas=notas.filter(n=>normaliza(n.text).includes(t)).sort((a,b)=>b.createdAt-a.createdAt);
  if(!encontradas.length){
    cont.innerHTML='<div class="search-empty">Nada en tus notas todavía. (La búsqueda dentro de Tareas y Vehículos llegará en la próxima fase.)</div>';
    return;
  }
  cont.innerHTML=encontradas.map(n=>`
    <div class="result-card"><span class="result-date">${fechaBonita(n.createdAt)}</span>${esc(n.text)}</div>
  `).join('');
}

// ── INIT ───────────────────────────────────────────────
renderModulos();
openDB().then(cargarNotas);
window.addEventListener('keydown', e=>{
  if(e.key==='Escape') cerrarModulo();
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
